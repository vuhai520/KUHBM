{% extends 'base.html' %}
{% block title %}Đăng nhập · KUHBM{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="mb-4 text-center d-flex align-items-center justify-content-center gap-2">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="KUHBM" style="width:36px;height:36px;border-radius:8px;">
                KUHBM
            </h3>
            <form method="POST"><input type="hidden" name="next" value="{{ request.values.get('next', '') }}"><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>
            <hr>
            <p class="text-center mb-0">Chưa có tài khoản? <a href="{{ url_for('auth.register', next=request.values.get('next', '')) }}">Đăng ký</a></p>
        </div>

    </div>
</div>
{% endblock %}
