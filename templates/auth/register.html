{% extends 'base.html' %}
{% block title %}Đăng ký · KUHBM{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="mb-4 text-center"><i class="bi bi-building"></i> Tạo tài khoản</h3>
            <form method="POST"><input type="hidden" name="next" value="{{ request.values.get('next', '') }}"><input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
            </form>
            <hr>
            <p class="text-center mb-0">Đã có tài khoản? <a href="{{ url_for('auth.login', next=request.values.get('next', '')) }}">Đăng nhập</a></p>
        </div>
    </div>
</div>
{% endblock %}
